name: refresh-data
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch: {}
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run refresh
        env:
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
      - run: npm test
      - name: Commit data if changed
        run: |
          git config user.name "labchess-bot"
          git config user.email "labchess-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || { git commit -m "chore(data): weekly refresh $(date -u +%F)"; git push; }
